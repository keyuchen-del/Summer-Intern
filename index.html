<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026暑期实习信息汇总</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; color: white; margin-bottom: 30px; padding: 20px 0; }
    header h1 { font-size: 2.2rem; margin-bottom: 8px; }
    header p { opacity: 0.8; font-size: 1rem; }
    
    .stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
    .stat-card .number { font-size: 1.8rem; font-weight: bold; color: #4fc3f7; }
    .stat-card .label { color: rgba(255,255,255,0.7); font-size: 0.8rem; }
    
    .update-time { text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 20px; font-size: 0.9rem; }
    
    .filters { background: rgba(255,255,255,0.95); padding: 20px; border-radius: 16px; margin-bottom: 20px; }
    .filters h3 { margin-bottom: 12px; color: #1a1a2e; font-size: 1.1rem; }
    .filter-section { margin-bottom: 12px; }
    .filter-section:last-child { margin-bottom: 0; }
    .filter-section-title { font-size: 0.8rem; color: #666; margin-bottom: 8px; font-weight: 600; }
    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 14px; border: 2px solid #4fc3f7; background: white; color: #4fc3f7;
      border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { background: #4fc3f7; color: white; }
    
    .internship-list { display: grid; gap: 20px; }
    .internship-card {
      background: rgba(255,255,255,0.95); border-radius: 16px; padding: 24px;
      display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s;
    }
    .internship-card:hover { transform: translateY(-3px); }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
    .company-info { flex: 1; }
    .company-name { font-size: 1.3rem; font-weight: bold; color: #1a1a2e; margin-bottom: 4px; }
    .position { color: #4fc3f7; font-size: 1rem; font-weight: 600; }
    .salary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; white-space: nowrap; }
    
    .description { color: #555; font-size: 0.9rem; line-height: 1.5; background: #f8f9fa; padding: 12px; border-radius: 8px; }
    
    .card-info { display: flex; gap: 20px; flex-wrap: wrap; color: #666; font-size: 0.85rem; }
    .card-info span { display: flex; align-items: center; gap: 4px; }
    
    .deadline { color: #e53935; font-weight: 600; }
    .deadline.urgent { color: #c62828; }
    
    .wechat-section { display: flex; align-items: center; gap: 10px; background: #e8f5e9; padding: 10px 14px; border-radius: 8px; flex-wrap: wrap; }
    .wechat-icon { font-size: 1.2rem; }
    .wechat-name { color: #2e7d32; font-weight: 600; font-size: 0.9rem; }
    
    .links-section { display: flex; gap: 10px; flex-wrap: wrap; }
    .detail-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #1976d2; text-decoration: none; font-size: 0.85rem;
      background: #e3f2fd; padding: 8px 14px; border-radius: 6px;
    }
    .detail-link:hover { background: #bbdefb; }
    .apply-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold;
    }
    .apply-link:hover { opacity: 0.85; }
    
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { background: #e3f2fd; color: #1976d2; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; }
    .tag.highlight { background: #e8f5e9; color: #388e3c; }
    .category-tag { background: #1a1a2e; color: white; }
    
    .no-result { text-align: center; padding: 40px; color: white; background: rgba(255,255,255,0.1); border-radius: 12px; }
    
    @media (max-width: 768px) {
      .card-header { flex-direction: column; }
      .salary { align-self: flex-start; }
      .links-section { flex-direction: column; }
      .detail-link, .apply-link { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

    <div class="update-time">数据最后更新: <span id="lastUpdate">2026-02-15</span></div>
    
    <div class="filters">

      <div class="filter-section">

          <button class="filter-btn" data-filter="北京">北京</button>
          <button class="filter-btn" data-filter="上海">上海</button>
          <button class="filter-btn" data-filter="深圳">深圳</button>

          <button class="filter-btn" data-filter="香港">香港</button>

      </div>
    </div>
    
    <div class="internship-list" id="internshipList"></div>
  </div>

      {id:16,company:"比亚迪",position:"2026暑期实习",salary:"200-300/天",location:"深圳/西安",duration:"3个月",requirements:"本科及以上",category:"实体企业",tags:["新能源","暑期实习"],region:"大陆",description:"新能源汽车/电池技术研发",deadline:"2026-04-30",wechatOfficial:"比亚迪招聘",detailLink:"https://career.byd.com/",applicationLink:"https://career.byd.com/"},
      
      // 管培生/快消
      {id:17,company:"联合利华",position:"2026暑期管培生",salary:"300-400/天",location:"上海/北京",duration:"8-10周",requirements:"本科及以上",category:"管培生",tags:["外企","快消","暑期实习"],region:"大陆",description:"UFLY Summer Intern，快消核心部门体验",deadline:"2026-02-28",wechatOfficial:"联合利华招聘",detailLink:"https://www.unilever.com/careers/students-and-graduates/",applicationLink:"https://www.unilever.com/careers/students-and-graduates/"},

      {id:19,company:"欧莱雅",position:"2026暑期实习",salary:"300/天",location:"上海/北京",duration:"6周",requirements:"本科及以上",category:"管培生",tags:["外企","快消","暑期实习"],region:"大陆",description:"市场/电商/研发暑期实习",deadline:"2026-02-25",wechatOfficial:"欧莱雅招聘",detailLink:"https://www.loreal.com/careers/students-and-graduates",applicationLink:"https://www.loreal.com/careers/students-and-graduates"},

    let currentCategory = 'all';
    let currentLocation = 'all';

    function isUrgent(deadline) {
      const today = new Date('2026-02-15');
      const d = new Date(deadline);
      const days = Math.ceil((d - today) / (1000*60*60*24));
      return days <= 15;
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = internships.length;
      document.getElementById('beijingCount').textContent = internships.filter(i => i.location.includes('北京')).length;
      document.getElementById('shanghaiCount').textContent = internships.filter(i => i.location.includes('上海')).length;
      document.getElementById('gzCount').textContent = internships.filter(i => i.location.includes('深圳') || i.location.includes('广州')).length;
      document.getElementById('hkCount').textContent = internships.filter(i => i.location.includes('香港')).length;
    }

    function renderList() {
      const list = document.getElementById('internshipList');
      let filtered = internships;
      if (currentCategory !== 'all') filtered = filtered.filter(i => i.category === currentCategory);
      if (currentLocation !== 'all') filtered = filtered.filter(i => i.location.includes(currentLocation));
      
      if (filtered.length === 0) {
        list.innerHTML = '<div class="no-result">暂无符合条件的实习信息</div>';
        return;
      }
      
      list.innerHTML = filtered.map(item => `
        <div class="internship-card">
          <div class="card-header">
            <div class="company-info">
              <div class="company-name">${item.company}</div>
              <div class="position">${item.position}</div>
            </div>
            <div class="salary">${item.salary}</div>
          </div>
          
          <div class="description">${item.description}</div>
          
          <div class="card-info">
            <span>📍 ${item.location}</span>
            <span>⏱️ ${item.duration}</span>
            <span>🎓 ${item.requirements}</span>
            <span class="deadline ${isUrgent(item.deadline) ? 'urgent' : ''}">📌 截止: ${item.deadline}</span>
          </div>
          
          <div class="wechat-section">
            <span class="wechat-icon">📱</span>
            <span class="wechat-name">公众号: ${item.wechatOfficial}</span>
          </div>
          
          <div class="links-section">
            <a href="${item.detailLink}" target="_blank" class="detail-link">📄 查看岗位详情</a>
            <a href="${item.applicationLink}" target="_blank" class="apply-link">🚀 投递简历</a>
          </div>
          
          <div class="tags">
            <span class="tag category-tag">${item.category}</span>
            ${item.tags.map(tag => `<span class="tag ${tag === '暑期实习' || tag === '大厂' || tag === '暑期项目' ? 'highlight' : ''}">${tag}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('categoryFilters').addEventListener('click', e => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('#categoryFilters .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.filter;
        renderList();
      }
    });

    document.getElementById('locationFilters').addEventListener('click', e => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('#locationFilters .filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentLocation = e.target.dataset.filter;
        renderList();
      }
    });

    updateStats();
    renderList();
  </script>
</body>
</html>
