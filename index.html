<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公众号每日推送整理与提炼</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b 45%, #334155);
      color: #0f172a;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1150px; margin: 0 auto; }
    header {
      color: #f8fafc;
      margin-bottom: 18px;
      text-align: center;
    }
    header h1 { font-size: 2rem; margin-bottom: 8px; }
    header p { color: #cbd5e1; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 960px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .full { grid-column: 1 / -1; }
    }

    .card {
      background: rgba(248, 250, 252, 0.98);
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: #0f172a;
    }

    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
    label { color: #334155; font-size: 0.86rem; font-weight: 600; }

    input, textarea, button, select {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      background: #fff;
    }
    textarea { min-height: 92px; resize: vertical; }
    button {
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      font-weight: 600;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    button:hover { transform: translateY(-1px); opacity: 0.92; }
    .btn-secondary { background: #475569; }
    .btn-danger { background: #dc2626; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .stat {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      background: #f8fafc;
      text-align: center;
    }
    .stat .num { font-size: 1.5rem; font-weight: 700; color: #1d4ed8; }
    .stat .txt { font-size: 0.82rem; color: #475569; }

    .list { display: grid; gap: 10px; margin-top: 12px; }
    .item {
      border: 1px solid #dbeafe;
      background: #eff6ff;
      border-radius: 10px;
      padding: 12px;
    }
    .item-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .item-title { font-weight: 700; color: #1e293b; }
    .item-meta { color: #475569; font-size: 0.84rem; }
    .item-summary {
      margin-top: 8px;
      padding: 8px;
      border-left: 3px solid #2563eb;
      background: #fff;
      color: #334155;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .chip {
      background: #e2e8f0;
      color: #334155;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
    }

    .muted { color: #64748b; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🗂️ 公众号每日推送整理与提炼</h1>
      <p>录入指定公众号文章，自动生成简版摘要与关键词洞察。</p>
    </header>

    <div class="grid">
      <section class="card">
        <h2>1) 目标公众号设置</h2>
        <div class="row">
          <div class="field">
            <label for="accountName">公众号名称</label>
            <input id="accountName" placeholder="例如：XX行业观察" />
          </div>
          <div class="field">
            <label for="updateTime">每日更新时间</label>
            <input id="updateTime" placeholder="例如：08:00" />
          </div>
        </div>
        <div class="row" style="margin-top: 10px;">
          <button id="saveConfig">保存配置</button>
          <button id="resetAll" class="btn-danger">清空全部数据</button>
        </div>
        <p id="configHint" class="muted" style="margin-top: 8px;">尚未保存配置。</p>
      </section>

      <section class="card">
        <h2>2) 每日推送录入</h2>
        <div class="field">
          <label for="postTitle">文章标题</label>
          <input id="postTitle" placeholder="输入当天推送标题" />
        </div>
        <div class="row" style="margin-top: 10px;">
          <div class="field">
            <label for="postDate">发布日期</label>
            <input id="postDate" type="date" />
          </div>
          <div class="field">
            <label for="postTag">主题标签</label>
            <select id="postTag">
              <option>行业动态</option>
              <option>政策解读</option>
              <option>公司分析</option>
              <option>投研方法</option>
              <option>其他</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-top: 10px;">
          <label for="postContent">正文或摘录（越完整，提炼越准）</label>
          <textarea id="postContent" placeholder="粘贴公众号推送内容（可部分摘录）"></textarea>
        </div>
        <div class="row" style="margin-top: 10px;">
          <button id="addPost">添加并提炼</button>
        </div>
      </section>

      <section class="card full">
        <h2>3) 提炼总览</h2>
        <div class="stats">
          <div class="stat"><div class="num" id="totalPosts">0</div><div class="txt">累计文章</div></div>
          <div class="stat"><div class="num" id="todayPosts">0</div><div class="txt">今日新增</div></div>
          <div class="stat"><div class="num" id="avgLength">0</div><div class="txt">平均字数</div></div>
          <div class="stat"><div class="num" id="policyRate">0%</div><div class="txt">政策解读占比</div></div>
        </div>

        <h3 style="margin-top: 12px; font-size: 1rem;">高频关键词</h3>
        <div id="keywords" class="chips"></div>

        <h3 style="margin-top: 12px; font-size: 1rem;">推送列表（含自动提炼）</h3>
        <div id="postList" class="list"></div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'wechat_digest_data_v1';
    const stopWords = new Set(['我们','你们','他们','这个','那个','以及','但是','因为','所以','一个','一些','可以','进行','对于','通过','如果','已经','主要','关于','相关','今天','发布','内容','文章','公众号','分析','提出','表示','显示','其中','需要']);

    const state = {
      config: { accountName: '', updateTime: '' },
      posts: []
    };

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        if (parsed.config) state.config = parsed.config;
        if (Array.isArray(parsed.posts)) state.posts = parsed.posts;
      } catch (e) {
        console.warn('解析缓存失败', e);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function extractSummary(text) {
      const cleaned = text.replace(/\s+/g, ' ').trim();
      if (!cleaned) return '（暂无内容可提炼）';
      const parts = cleaned.split(/[。！？!?]/).map(s => s.trim()).filter(Boolean);
      const top = parts.slice(0, 2).join('；');
      return top || cleaned.slice(0, 100);
    }

    function extractKeywords(text) {
      const words = text.match(/[\u4e00-\u9fa5]{2,}/g) || [];
      const freq = {};
      words.forEach(w => {
        if (stopWords.has(w)) return;
        freq[w] = (freq[w] || 0) + 1;
      });
      return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([word]) => word);
    }

    function aggregateKeywords(posts) {
      const freq = {};
      posts.forEach(post => {
        (post.keywords || []).forEach(k => { freq[k] = (freq[k] || 0) + 1; });
      });
      return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 12);
    }

    function updateStats() {
      const total = state.posts.length;
      const today = new Date().toISOString().slice(0, 10);
      const todayCount = state.posts.filter(p => p.date === today).length;
      const avg = total ? Math.round(state.posts.reduce((sum, p) => sum + p.length, 0) / total) : 0;
      const policyCount = state.posts.filter(p => p.tag === '政策解读').length;
      const policyRate = total ? Math.round((policyCount / total) * 100) : 0;

      document.getElementById('totalPosts').textContent = total;
      document.getElementById('todayPosts').textContent = todayCount;
      document.getElementById('avgLength').textContent = avg;
      document.getElementById('policyRate').textContent = policyRate + '%';

      const keywordWrap = document.getElementById('keywords');
      const topKeywords = aggregateKeywords(state.posts);
      keywordWrap.innerHTML = topKeywords.length
        ? topKeywords.map(([k, n]) => `<span class="chip">${k} × ${n}</span>`).join('')
        : '<span class="muted">暂无关键词，请先录入推送。</span>';
    }

    function renderPosts() {
      const list = document.getElementById('postList');
      if (state.posts.length === 0) {
        list.innerHTML = '<p class="muted">尚无推送记录。请先添加一篇文章。</p>';
        return;
      }
      list.innerHTML = state.posts
        .slice()
        .sort((a, b) => b.createdAt - a.createdAt)
        .map(post => `
          <article class="item">
            <div class="item-head">
              <div>
                <div class="item-title">${post.title}</div>
                <div class="item-meta">${post.date} · ${post.tag} · ${post.length} 字</div>
              </div>
              <button class="btn-secondary" data-id="${post.id}">删除</button>
            </div>
            <div class="item-summary">💡 提炼：${post.summary}</div>
            <div class="chips">
              ${(post.keywords || []).map(k => `<span class="chip">${k}</span>`).join('') || '<span class="muted">无关键词</span>'}
            </div>
          </article>
        `)
        .join('');
    }

    function syncConfigToForm() {
      document.getElementById('accountName').value = state.config.accountName || '';
      document.getElementById('updateTime').value = state.config.updateTime || '';
      const hint = state.config.accountName
        ? `当前追踪：${state.config.accountName}（每日 ${state.config.updateTime || '--:--'}）`
        : '尚未保存配置。';
      document.getElementById('configHint').textContent = hint;
    }

    document.getElementById('saveConfig').addEventListener('click', () => {
      state.config.accountName = document.getElementById('accountName').value.trim();
      state.config.updateTime = document.getElementById('updateTime').value.trim();
      saveState();
      syncConfigToForm();
    });

    document.getElementById('addPost').addEventListener('click', () => {
      const title = document.getElementById('postTitle').value.trim();
      const date = document.getElementById('postDate').value;
      const tag = document.getElementById('postTag').value;
      const content = document.getElementById('postContent').value.trim();

      if (!title || !date || !content) {
        alert('请至少填写标题、日期和正文摘录。');
        return;
      }

      const post = {
        id: Date.now(),
        title,
        date,
        tag,
        content,
        length: content.length,
        summary: extractSummary(content),
        keywords: extractKeywords(content),
        createdAt: Date.now()
      };

      state.posts.push(post);
      saveState();
      updateStats();
      renderPosts();

      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
    });

    document.getElementById('postList').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      const id = Number(e.target.dataset.id);
      state.posts = state.posts.filter(post => post.id !== id);
      saveState();
      updateStats();
      renderPosts();
    });

    document.getElementById('resetAll').addEventListener('click', () => {
      if (!confirm('确定清空所有配置与推送记录吗？')) return;
      state.config = { accountName: '', updateTime: '' };
      state.posts = [];
      saveState();
      syncConfigToForm();
      updateStats();
      renderPosts();
    });

    loadState();
    syncConfigToForm();
    updateStats();
    renderPosts();
  </script>
</body>
</html>
